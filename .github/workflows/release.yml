name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'dalamud'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          "DALAMUD_HOME=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore locked dependencies
        run: dotnet restore .\GlamSpector.csproj --locked-mode --verbosity normal

      - name: Validate tag and release metadata
        shell: pwsh
        run: .\scripts\Validate-Release.ps1 -Channel Testing -ReleaseTag $env:GITHUB_REF_NAME

      - name: Build Release package
        run: dotnet build .\GlamSpector.csproj --no-restore --configuration Release --verbosity minimal --warnaserror

      - name: Validate packaged release
        shell: pwsh
        run: .\scripts\Validate-Release.ps1 -Channel Testing -ReleaseTag $env:GITHUB_REF_NAME -PackagePath .\bin\Release\GlamSpector\latest.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = (Resolve-Path '.\bin\Release\GlamSpector\latest.zip').Path
          if ((Get-Item -LiteralPath $package).Length -le 0) {
            throw 'The packaged plugin ZIP is empty.'
          }
          gh release create $env:GITHUB_REF_NAME $package --verify-tag --title $env:GITHUB_REF_NAME --generate-notes
